[package]
name="voxtype"
version="1.0.1"
edition="2024"
[dependencies]
libc="0.2"
anyhow="1"
clap={version="4",features=["derive","env"]}
gtk4="0.11"
gtk4-layer-shell="0.8"
cairo-rs="0.22"
serde={version="1",features=["derive"]}
toml="0.8"
tokio={version="1",features=["full"]}
tracing="0.1"
tracing-subscriber={version="0.3",features=["env-filter"]}
[profile.dev]
debug=0
